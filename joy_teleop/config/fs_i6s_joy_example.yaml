#Configuración para cmd_vel con Twist Stamped
joy_teleop:
  ros__parameters:

    walk:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: cmd_vel
      deadman_buttons: [5]

      axis_mappings:
        twist-linear-x:
          axis: 1
          scale: 0.5
          offset: 0.0

        twist-angular-z:
          axis: 0
          scale: 1.0
          offset: 0.0

        header-frame_id:
          value: "base_link"

